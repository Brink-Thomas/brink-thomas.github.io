collections:
  - name: profile
    label: About & CV
    path: src/content/profile
    type: file
    file: src/content/profile/about.md
    fields:
      - name: name
        label: Full Name
        type: string
      - name: role
        label: Current Role / Title
        type: string
      - name: email
        label: Email Address
        type: string
      - name: github
        label: GitHub URL
        type: string
      - name: skills
        label: Core Skills
        type: list
        field:
          type: string
      - name: body
        label: CV Body Content
        type: rich-text