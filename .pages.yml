media:
  input: public/images
  output: /images

content:
  - name: profile
    label: "About Me / CV"
    type: file
    path: src/content/profile/about.md
    fields:
      - name: name
        label: "Full Name"
        type: string
        required: true
      - name: role
        label: "Headline / Role"
        type: string
      - name: email
        label: "Contact Email"
        type: string
      - name: github
        label: "GitHub Profile Link"
        type: string
      - name: body
        label: "Biography / Experience / CV Content"
        type: rich-text

  - name: portfolio
    label: "Portfolio Projects"
    type: collection
    path: src/content/projects
    fields:
      - name: title
        label: "Project Title"
        type: string
        required: true
      - name: summary
        label: "Short Description"
        type: string
      - name: liveUrl
        label: "Live Demo URL"
        type: string
      - name: repoUrl
        label: "Source Code URL"
        type: string
      - name: tags
        label: "Tech Stack (comma separated)"
        type: string
      - name: body
        label: "Detailed Case Study"
        type: rich-text